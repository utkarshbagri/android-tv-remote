# Generate the Xcode project with:  xcodegen generate
name: TVRemote
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
    watchOS: "10.0"
packages:
  ATVRemoteKit:
    path: .
targets:
  TVRemote:
    type: application
    platform: iOS
    sources: [App/TVRemote, App/Shared]
    # DEVELOPMENT_TEAM + BUNDLE_ID_PREFIX come from Config/Signing(.local).xcconfig.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: ATVRemoteKit
      - target: TVRemoteWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tvremote
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: TV Remote
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Finds and controls your Android TV on the local network."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: App/TVRemote/Info.plist
      properties:
        NSBonjourServices:
          - _androidtvremote2._tcp
          - _googlecast._tcp
  # Apple Watch companion app. It can't open the TV's socket itself (watchOS limits raw
  # networking), so it relays commands to the iPhone app over WatchConnectivity.
  TVRemoteWatch:
    type: application
    platform: watchOS
    sources: [App/TVRemoteWatch, App/Shared]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: ATVRemoteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tvremote.watchkitapp
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: TV Remote
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).tvremote
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
